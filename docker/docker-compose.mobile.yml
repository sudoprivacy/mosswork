# =============================================================================
# mosswork — Remote Phone (mobile) compose overlay for local / DinD testing
#
# Usage (from repo root):
#   # once: download platform-tools next to the repo
#   mkdir -p .tools && cd /tmp && curl -fsSL -o pt.zip \
#     https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
#     && unzip -qo pt.zip -d /workspace/mosswork/.tools
#
#   docker compose -f docker/docker-compose.mobile.yml up -d --build
#
# This file is standalone (not an overlay) because ``network_mode: host``
# conflicts with published ``ports`` from the base compose file.
#
# Host prerequisites:
# - Docker socket usable by the container
# - /dev/binder or /dev/binderfs on the host
# - Enough free disk for the Redroid image
# =============================================================================

services:
  mosswork:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mosswork:latest
    container_name: mosswork
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ${MOSSWORK_DATA:-~/.mosswork}:/data/.mosswork
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs
      - ${MOSSWORK_PLATFORM_TOOLS:-../.tools/platform-tools}:/opt/android-sdk/platform-tools:ro
    environment:
      - HOME=/data
      - MOSSWORK_BIND_HOST=0.0.0.0
      - MOSSWORK_PORT=${MOSSWORK_PORT:-8088}
      - MOSSWORK_LOG_LEVEL=${MOSSWORK_LOG_LEVEL:-info}
      - MOSSWORK_DEFAULT_PASSWORD=${MOSSWORK_DEFAULT_PASSWORD:-}
      - MOSSWORK_ADMIN_USERNAME=${MOSSWORK_ADMIN_USERNAME:-admin}
      - MOSSWORK_MOBILE_ADB_HOST=${MOSSWORK_MOBILE_ADB_HOST:-127.0.0.1:5555}
      - MOSSWORK_MOBILE_CONTAINER=${MOSSWORK_MOBILE_CONTAINER:-mosswork-mobile-android}
      - MOSSWORK_ENABLE_MOBILE=${MOSSWORK_ENABLE_MOBILE:-1}
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
