<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mosswork</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        padding: 28px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        line-height: 1.6;
      }
      #note {
        opacity: 0.65;
        font-size: 12px;
      }
      progress {
        width: 100%;
        margin: 12px 0;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }
      button {
        padding: 8px 14px;
        border: 1px solid #8886;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      #restart,
      #download {
        background: #e85d75;
        color: white;
        border-color: transparent;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p id="versions"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <progress id="progress" hidden></progress>
    <p id="note"></p>
    <footer>
      <button id="check" type="button"></button>
      <button id="download" type="button" hidden></button>
      <button id="restart" type="button" hidden></button>
    </footer>
    <script type="module" src="/desktop-update.js"></script>
  </body>
</html>
