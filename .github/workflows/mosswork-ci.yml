name: mosswork release checks

on:
  pull_request:
    paths:
      - '.github/workflows/mosswork-*.yml'
      - 'conftest.py'
      - 'tools/test_gate.py'
      - 'tools/ci_identity_reuse.py'
      - 'desktop/package-company.py'
      - 'desktop/*tools*'
      - 'desktop/tests/**'
      - 'docker/**'
      - 'packages/**'
      - 'desktop/portable/**'
      - 'tests/unit/infra/test_local_harness.py'
      - 'tests/unit/infra/test_local_components.py'
      - 'tests/unit/infra/test_harness_config_imports.py'
      - 'src/octop/infra/utils/frontmatter.py'
      - 'tests/unit/utils/test_frontmatter.py'
      - 'tests/unit/test_bundled_plugins_layout.py'
      - 'tests/unit/test_cli_main.py'
      - 'scripts/install-moss-server.sh'
      - 'tools/publish-release-to-cos.sh'
      - 'tools/desktop_update_manifest.py'
      - 'desktop/src/**'
      - 'tools/*public_source.py'
      - 'tools/accept_sudograph_worker.py'
      - 'tools/package_sudograph_worker.py'
      - 'tools/precommit.py'
      - '.githooks/pre-commit'
      - '.githooks/test-gate'
      - '.gitattributes'
      - 'AGENTS.md'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/octop/infra/connectors/**'
      - 'tests/unit/connectors/**'
      - 'tests/unit/api/test_knowledge_bases.py'
      - 'tests/unit/company_runtime/test_desktop_capacity.py'
      - 'src/octop/infra/sudograph/**'
      - 'tests/unit/sudograph/**'
      - 'tests/integration/test_sudograph_client_worker.py'
      - 'tests/unit/deployment/**'
      - 'tools/fetch_acp_test_engine.py'
      - 'tests/unit/acp/**'
      - 'tests/unit/db/test_execution.py'
      - 'tests/unit/agents/test_acp_settings.py'
      - 'tests/integration/test_acp_api.py'
      - 'tests/support/acp_*'
      - 'src/octop/api/routers/chat/**'
      - 'src/octop/api/common/canonical_identity.py'
      - 'src/octop/infra/agents/execution_backend.py'
      - 'src/octop/infra/execution/**'
      - 'src/octop/infra/db/repos/execution.py'
      - 'src/octop/infra/identity/**'
      - 'src/octop/api/app.py'
      - 'src/octop/api/deps.py'
      - 'src/octop/api/routers/canonical_*.py'
      - 'src/octop/api/middleware/setup_lockdown.py'
      - 'src/octop/infra/db/repos/canonical_identity.py'
      - 'src/octop/infra/gateway/feishu_delivery.py'
      - 'src/octop/i18n/**'
      - 'tests/unit/gateway/test_canonical_feishu.py'
      - 'tests/unit/gateway/test_feishu_delivery_business_store.py'
      - 'tests/unit/auth/test_feishu_adapter.py'
      - 'tests/unit/db/test_canonical_identity_projection.py'
      - 'tests/unit/i18n/**'
      - 'tests/unit/api/test_canonical*'
      - 'tests/unit/test_canonical*'
      - 'tests/unit/test_r26_pc3_sms_mount.py'
      - 'tests/unit/agents/test_managed_lifecycle_admission.py'
      - 'tests/unit/identity/**'
      - 'tests/unit/connectors/test_qcc_grant.py'
      - 'tests/unit/connectors/test_qcc_oauth_grant.py'
      - 'tests/unit/agents/test_memory_slim.py'
      - 'tests/unit/agents/test_agent_manager.py'
      - 'tests/unit/company_runtime/test_local_process.py'
      - 'src/octop/infra/company_runtime/local.py'
      - 'src/octop/infra/company_runtime/processes.py'
      - 'tests/unit/company_runtime/test_supervised_process_leaf.py'
      - 'src/octop/infra/db/repos/retained_mcp.py'
      - 'src/octop/infra/native_host/reviewed_mcp.py'
      - 'src/octop/infra/native_host/sudograph.py'
      - 'tests/unit/native_host/test_sudograph*.py'
      - 'tests/unit/db/fixtures/retained_mcp_103.sql'
      - 'tests/unit/native_host/test_reviewed_mcp.py'
      - 'tests/unit/native_host/test_registered_mcp_composition.py'
      - 'tests/unit/connectors/test_fixed_json.py'
      - 'src/octop/api/routers/knowledge_bases.py'
      - 'src/octop/infra/agents/providers/onnx_service.py'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR commits share a group; manual runs keep their own run ID.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-scope:
    name: CI input scope
    runs-on: ubuntu-24.04
    outputs:
      runtime_matrix: ${{ steps.scope.outputs.runtime_matrix }}
      windows_validation: ${{ steps.scope.outputs.windows_validation }}
      validator_regressions: ${{ steps.scope.outputs.validator_regressions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select runtime matrices from committed inputs
        id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/precommit.py --ci-plan "$CI_BASE" "$CI_HEAD"

  windows-validation-tools:
    name: Windows validation tools
    needs: ci-scope
    if: needs.ci-scope.outputs.windows_validation == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Run existing validators and export the complete current source
        shell: bash
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python tools/precommit.py --ci-tools "$CI_BASE" "$CI_HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation-tools
          path: |
            ${{ runner.temp }}/mosswork-ci-tools-*/receipt.json
            ${{ runner.temp }}/mosswork-ci-tools-*/public-source/PUBLIC_SOURCE.json
          if-no-files-found: ignore

  acp-runtime-observations:
    name: ACP runtime observations (${{ matrix.os }})
    needs: ci-scope
    if: needs.ci-scope.outputs.runtime_matrix == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked
      - name: Check the ACP implementation and contract tests
        run: |
          uv run --locked ruff check packages/moss-harness/src/moss_harness/acp/runtime_status.py packages/moss-harness/src/moss_harness/acp/service.py packages/moss-harness/src/moss_harness/builtin/tools/acp_runner.py tests/unit/acp tests/support/acp_status_gate.py tools/fetch_acp_test_engine.py
          uv run --locked ruff format --check packages/moss-harness/src/moss_harness/acp/runtime_status.py packages/moss-harness/src/moss_harness/acp/service.py packages/moss-harness/src/moss_harness/builtin/tools/acp_runner.py tests/unit/acp tests/support/acp_status_gate.py tools/fetch_acp_test_engine.py
          uv run --locked mypy --config-file packages/moss-harness/pyproject.toml --follow-imports=silent packages/moss-harness/src/moss_harness/acp/runtime_status.py packages/moss-harness/src/moss_harness/acp/service.py packages/moss-harness/src/moss_harness/builtin/tools/acp_runner.py
      - name: Fetch the digest-pinned native test engine
        shell: bash
        run: |
          SCODE_BIN="$(uv run --locked python tools/fetch_acp_test_engine.py --output "$RUNNER_TEMP/acp-test-engine")"
          echo "SCODE_BIN=$SCODE_BIN" >> "$GITHUB_ENV"
      - name: Exercise the shared service and actual native process
        env:
          MOSSWORK_ACP_RUNTIME_E2E: '1'
        run: uv run --locked pytest tests/unit/acp tests/unit/agents/test_acp_settings.py tests/integration/test_acp_api.py -q

  sudograph-interop:
    name: Packaged Sudograph connector interoperability
    needs: ci-scope
    if: needs.ci-scope.outputs.runtime_matrix == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CI_VALIDATOR_REGRESSIONS: ${{ needs.ci-scope.outputs.validator_regressions }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
          cache-dependency-path: packages/sudograph-worker/npm-shrinkwrap.json
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sudograph-artifacts/sudograph_compiler-0.1.0-py3-none-any.whl
          key: sudograph-compiler-${{ runner.os }}-b0fcd5b257b995f9764081968f4c797f00d5a70f1d04b771c11818f5204e6ef2
      - name: Check registered JSON HTTP, TLS and MCP boundaries
        run: |
          uv run --frozen ruff check src/octop/infra/connectors/{fixed_json,tool_protocol,registered_model}.py tests/unit/connectors/test_{fixed_json,registered_model}.py
          uv run --frozen ruff format --check src/octop/infra/connectors/{fixed_json,tool_protocol,registered_model}.py tests/unit/connectors/test_{fixed_json,registered_model}.py
          uv run --frozen mypy --strict src/octop/infra/connectors/{fixed_json,tool_protocol,registered_model}.py
          uv run --frozen pytest tests/unit/connectors/test_fixed_json.py tests/unit/connectors/test_registered_model.py -q --junitxml "$RUNNER_TEMP/fixed-json.xml"
      - name: Check safe frontmatter parsing
        run: |
          uv run --frozen ruff check src/octop/infra/utils/frontmatter.py tests/unit/utils/test_frontmatter.py
          uv run --frozen ruff format --check src/octop/infra/utils/frontmatter.py tests/unit/utils/test_frontmatter.py
          uv run --frozen mypy --follow-imports=silent src/octop/infra/utils/frontmatter.py
      - name: Check source-bound local acceptance
        shell: bash
        run: |
          uv run --frozen ruff check tools/test_gate.py tools/ci_identity_reuse.py conftest.py tests/unit/deployment/test_test_gate.py tests/unit/deployment/test_ci_identity_reuse.py
          uv run --frozen ruff format --check tools/test_gate.py tools/ci_identity_reuse.py conftest.py tests/unit/deployment/test_test_gate.py tests/unit/deployment/test_ci_identity_reuse.py
          uv run --frozen mypy --strict tools/test_gate.py
          uv run --frozen mypy --strict tools/ci_identity_reuse.py
      - name: Check shared fixture and cold CLI isolation
        run: |
          uv run --frozen pytest tests/unit/connectors/test_qcc_grant.py tests/unit/connectors/test_qcc_oauth_grant.py tests/unit/test_bundled_plugins_layout.py tests/unit/test_cli_main.py tests/unit/agents/test_memory_slim.py tests/unit/agents/test_agent_manager.py -q --junitxml "$RUNNER_TEMP/shared-isolation.xml"
      - name: Check isolated dependencies and live worker fixtures
        run: |
          uv run --frozen pytest tests/unit/api/test_knowledge_bases.py tests/unit/company_runtime/test_desktop_capacity.py tests/unit/company_runtime/test_local_process.py tests/unit/company_runtime/test_supervised_process_leaf.py tests/unit/infra/test_harness_config_imports.py -q --junitxml "$RUNNER_TEMP/shared-fixtures.xml"
          uv run --frozen pytest tests/unit/db/test_execution.py -q
      - name: Check retained reviewed registrations and current product ports
        run: |
          uv run --frozen ruff check src/octop/infra/db/repos/retained_mcp.py src/octop/infra/native_host/reviewed_mcp.py tests/unit/native_host/test_reviewed_mcp.py tests/unit/native_host/test_registered_mcp_composition.py
          uv run --frozen ruff format --check src/octop/infra/db/repos/retained_mcp.py src/octop/infra/native_host/reviewed_mcp.py tests/unit/native_host/test_reviewed_mcp.py tests/unit/native_host/test_registered_mcp_composition.py
          uv run --frozen mypy --strict --follow-imports=silent src/octop/infra/db/repos/retained_mcp.py src/octop/infra/native_host/reviewed_mcp.py
          uv run --frozen pytest tests/unit/native_host/test_reviewed_mcp.py tests/unit/native_host/test_registered_mcp_composition.py -q \
            --junitxml "$RUNNER_TEMP/reviewed-mcp.xml"
      - name: Check canonical business, current member writes and same-instance composition
        run: |
          uv run --frozen pytest tests/unit/identity tests/unit/gateway/test_canonical_feishu.py tests/unit/gateway/test_feishu_delivery_business_store.py tests/unit/auth/test_feishu_adapter.py tests/unit/api/test_canonical_request_dependency.py tests/unit/test_canonical_business_product_composition.py tests/unit/test_canonical_business_supplements_consumer.py tests/unit/test_canonical_product_startup.py tests/unit/test_r26_pc3_sms_mount.py tests/unit/db/test_canonical_identity_projection.py tests/unit/i18n -q --junitxml "$RUNNER_TEMP/canonical-business.xml"
      - name: Check canonical chat and original actor admission
        run: |
          uv run --frozen pytest tests/unit/api/test_canonical_chat_websocket.py tests/unit/api/test_canonical_websocket_principal.py tests/unit/test_canonical_execution_admission.py tests/unit/test_canonical_queue_reauthentication.py tests/unit/test_canonical_execution_reauthentication_http.py tests/unit/agents/test_managed_lifecycle_admission.py -q --junitxml "$RUNNER_TEMP/canonical-chat-admission.xml"
      - name: Build, test and verify the installed current-source worker
        run: |
          uv run --no-project python tools/package_sudograph_worker.py --output "$RUNNER_TEMP/sudograph-worker-package"
          uv run --no-project python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'sudograph-worker-package/receipt.json').read_text())
          assert receipt['passed'] is True
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f"SUDOGRAPH_WORKER_PATH={receipt['worker']}\n")
              out.write(f"SUDOGRAPH_WORKER_SHA256={receipt['worker_sha256']}\n")
          PY
      - name: Verify published compiler bytes
        shell: bash
        run: |
          set -euo pipefail
          artifact_temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            artifact_temp="$(cygpath -u "$artifact_temp")"
          fi
          artifacts="$artifact_temp/sudograph-artifacts"
          wheel="$artifacts/sudograph_compiler-0.1.0-py3-none-any.whl"
          mkdir -p "$artifacts"
          if [ ! -f "$wheel" ]; then
            curl --fail --location --output "$wheel" https://github.com/sudoprivacy/sudograph/releases/download/v0.1.0/sudograph_compiler-0.1.0-py3-none-any.whl
          fi
          echo "b0fcd5b257b995f9764081968f4c797f00d5a70f1d04b771c11818f5204e6ef2  $wheel" | sha256sum --check
          uv venv "$RUNNER_TEMP/sudograph-compiler" --python 3.12
          compiler="$RUNNER_TEMP/sudograph-compiler/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then
            compiler="$RUNNER_TEMP/sudograph-compiler/Scripts/python.exe"
          fi
          uv pip install --python "$compiler" --only-binary :all: "$wheel"
          echo "SUDOGRAPH_COMPILER_PYTHON=$compiler" >> "$GITHUB_ENV"
      - name: Run actual connector and compiler acceptance
        run: |
          uv run --no-default-groups --frozen python tools/accept_sudograph_worker.py \
            --worker "$SUDOGRAPH_WORKER_PATH" \
            --worker-sha256 "$SUDOGRAPH_WORKER_SHA256" \
            --compiler-python "$SUDOGRAPH_COMPILER_PYTHON" \
            --emit-review-fixture \
            --output "$RUNNER_TEMP/sudograph-acceptance"
      - name: Check connector regressions and portable source exports
        run: |
          # Linux deployment checks already run in release-checks; retain the other platforms here.
          connector_tests=(tests/unit/connectors/test_custom_mcp.py tests/unit/utils/test_frontmatter.py)
          if [ "$RUNNER_OS" != Linux ] && [ "${CI_VALIDATOR_REGRESSIONS:-true}" != false ]; then
            connector_tests+=(tests/unit/deployment/test_export_public_source.py tests/unit/deployment/test_precommit.py tests/unit/deployment/test_test_gate.py tests/unit/deployment/test_ci_identity_reuse.py tests/unit/deployment/test_make_format_gate.py tests/unit/deployment/test_make_testmon.py)
          fi
          uv run --frozen pytest "${connector_tests[@]}" -q
          if [ "$RUNNER_OS" != Linux ] && [ "${CI_VALIDATOR_REGRESSIONS:-true}" = false ]; then
            uv run --frozen pytest tests/unit/deployment/test_make_testmon.py::test_full_make_records_real_baseline_and_preserves_failure -q
          fi
          uv run --frozen pytest tests/integration/test_connectors_api.py -q -k 'patch_custom_mcp_server_default_open_only or shared_custom_mcp_is_visible_with_collision_safe_name or chat_rejects_unknown_mcp or chat_accepts_user_instance_mcp'
          uv run --frozen python tools/export_public_source.py --output "$RUNNER_TEMP/sudograph-public-source"
          uv run --frozen python tools/check_public_source.py --root "$RUNNER_TEMP/sudograph-public-source"
      - name: Check domain client with the real installed worker
        run: |
          export MOSSWORK_TEST_SUDOGRAPH_WORKER="$SUDOGRAPH_WORKER_PATH"
          export MOSSWORK_TEST_SUDOGRAPH_WORKER_SHA256="$SUDOGRAPH_WORKER_SHA256"
          export MOSSWORK_TEST_SUDOGRAPH_COMPILER="$SUDOGRAPH_COMPILER_PYTHON"
          uv run --frozen ruff check src/octop/infra/sudograph src/octop/infra/native_host/sudograph.py tests/unit/sudograph tests/unit/native_host/test_sudograph.py tests/unit/native_host/test_sudograph_write_outcome.py tests/integration/test_sudograph_client_worker.py
          uv run --frozen ruff format --check src/octop/infra/sudograph src/octop/infra/native_host/sudograph.py tests/unit/sudograph tests/unit/native_host/test_sudograph.py tests/unit/native_host/test_sudograph_write_outcome.py tests/integration/test_sudograph_client_worker.py
          uv run --frozen mypy src/octop/infra/sudograph src/octop/infra/native_host/sudograph.py --follow-imports=silent
          uv run --frozen pytest tests/unit/sudograph tests/unit/native_host/test_sudograph.py tests/unit/native_host/test_sudograph_write_outcome.py tests/integration/test_sudograph_client_worker.py -q \
            --basetemp "$RUNNER_TEMP/sudograph-domain-client" --junitxml "$RUNNER_TEMP/sudograph-domain-client.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sudograph-interop-receipts-${{ runner.os }}
          path: |
            ${{ runner.temp }}/sudograph-acceptance/receipt.json
            ${{ runner.temp }}/sudograph-acceptance/checks.json
            ${{ runner.temp }}/sudograph-acceptance/incomplete.json
            ${{ runner.temp }}/sudograph-acceptance/registration.stdout.log
            ${{ runner.temp }}/sudograph-acceptance/registration.stderr.log
            ${{ runner.temp }}/sudograph-acceptance/browser-fixture/
            ${{ runner.temp }}/sudograph-worker-package/*.json
            ${{ runner.temp }}/sudograph-worker-package/*.log
            ${{ runner.temp }}/sudograph-worker-package/*.tgz
            ${{ runner.temp }}/sudograph-domain-client.xml
            ${{ runner.temp }}/fixed-json.xml
            ${{ runner.temp }}/reviewed-mcp.xml
            ${{ runner.temp }}/canonical-business.xml
            ${{ runner.temp }}/canonical-chat-admission.xml
            ${{ runner.temp }}/shared-fixtures.xml
            ${{ runner.temp }}/shared-isolation.xml
            ${{ runner.temp }}/sudograph-domain-client/**/domain-client-receipt.json
            ${{ runner.temp }}/sudograph-domain-client/**/fixed-json-client-receipt.json
            ${{ runner.temp }}/sudograph-domain-client/**/write-outcome-receipt.json
          if-no-files-found: ignore
  release-checks:
    needs: ci-scope
    runs-on: ubuntu-24.04
    env:
      CI_VALIDATOR_REGRESSIONS: ${{ needs.ci-scope.outputs.validator_regressions }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Check independent validation tools and the complete current source
        if: needs.ci-scope.outputs.windows_validation == 'true'
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python tools/precommit.py --ci-tools "$CI_BASE" "$CI_HEAD"
      - name: Test packaging, exports and deployment
        if: needs.ci-scope.outputs.windows_validation != 'true'
        run: |
          validator_args=()
          if [ "${CI_VALIDATOR_REGRESSIONS:-true}" = false ]; then
            for module in test_export_public_source test_precommit test_test_gate test_ci_identity_reuse test_make_format_gate test_make_testmon; do
              validator_args+=("--ignore=tests/unit/deployment/$module.py")
            done
          fi
          uv run --frozen pytest tests/unit/deployment desktop/tests/test_package_company.py desktop/tests/test_company_tools.py tests/unit/infra/test_local_harness.py tests/unit/infra/test_local_components.py tests/unit/infra/test_brand_environment.py "${validator_args[@]}" -q
          if [ "${CI_VALIDATOR_REGRESSIONS:-true}" = false ]; then
            uv run --frozen pytest tests/unit/deployment/test_make_testmon.py::test_full_make_records_real_baseline_and_preserves_failure -q
          fi
      - name: Check shell and workflow syntax
        run: |
          for script in scripts/install-moss-server.sh docker/deploy/*.sh docker/enterprise/{prepare.sh,deploy.sh,start.sh,stop.sh}; do
            bash -n "$script"
          done
          bash -n tools/publish-release-to-cos.sh
          sh -n .githooks/test-gate
          shellcheck scripts/install-moss-server.sh tools/publish-release-to-cos.sh docker/deploy/*.sh docker/enterprise/{prepare.sh,deploy.sh,start.sh,stop.sh}
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/mosswork-ci.yml .github/workflows/mosswork-release.yml .github/workflows/mosswork-cos-publish.yml .github/workflows/mosswork-desktop-update.yml
      - name: Validate public source export
        if: needs.ci-scope.outputs.windows_validation != 'true'
        run: |
          python3 tools/export_public_source.py --output "$RUNNER_TEMP/mosswork-source"
          python3 tools/check_public_source.py --root "$RUNNER_TEMP/mosswork-source"
      - uses: actions/upload-artifact@v4
        if: always() && needs.ci-scope.outputs.windows_validation == 'true'
        with:
          name: linux-validation-tools
          path: |
            ${{ runner.temp }}/mosswork-ci-tools-*/receipt.json
            ${{ runner.temp }}/mosswork-ci-tools-*/public-source/PUBLIC_SOURCE.json
          if-no-files-found: ignore
