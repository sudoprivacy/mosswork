name: mosswork release checks

on:
  pull_request:
    paths:
      - '.github/workflows/mosswork-*.yml'
      - 'desktop/package-company.py'
      - 'desktop/*tools*'
      - 'desktop/tests/**'
      - 'docker/**'
      - 'packages/**'
      - 'desktop/portable/**'
      - 'tests/unit/infra/test_local_harness.py'
      - 'tests/unit/infra/test_local_components.py'
      - 'scripts/install-moss-server.sh'
      - 'tools/publish-release-to-cos.sh'
      - 'tools/*public_source.py'
      - 'tools/accept_sudograph_worker.py'
      - 'tools/package_sudograph_worker.py'
      - 'tools/precommit.py'
      - '.githooks/pre-commit'
      - '.gitattributes'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/octop/infra/connectors/**'
      - 'tests/unit/connectors/**'
      - 'tests/unit/api/test_knowledge_bases.py'
      - 'tests/unit/company_runtime/test_desktop_capacity.py'
      - 'src/octop/infra/sudograph/**'
      - 'tests/unit/sudograph/**'
      - 'tests/integration/test_sudograph_client_worker.py'
      - 'tests/unit/deployment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sudograph-interop:
    name: Packaged Sudograph connector interoperability
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
          cache-dependency-path: packages/sudograph-worker/npm-shrinkwrap.json
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sudograph-artifacts/sudograph_compiler-0.1.0-py3-none-any.whl
          key: sudograph-compiler-${{ runner.os }}-b0fcd5b257b995f9764081968f4c797f00d5a70f1d04b771c11818f5204e6ef2
      - name: Check registered JSON HTTP, TLS and MCP boundaries
        run: |
          uv run --frozen ruff check src/octop/infra/connectors/{fixed_json,tool_protocol}.py tests/unit/connectors/test_fixed_json.py
          uv run --frozen ruff format --check src/octop/infra/connectors/{fixed_json,tool_protocol}.py tests/unit/connectors/test_fixed_json.py
          uv run --frozen mypy --strict src/octop/infra/connectors/{fixed_json,tool_protocol}.py
          uv run --frozen pytest tests/unit/connectors/test_fixed_json.py -q --junitxml "$RUNNER_TEMP/fixed-json.xml"
      - name: Check isolated dependencies and live worker fixtures
        run: |
          uv run --frozen pytest tests/unit/api/test_knowledge_bases.py tests/unit/company_runtime/test_desktop_capacity.py tests/unit/company_runtime/test_local_process.py -q --junitxml "$RUNNER_TEMP/shared-fixtures.xml"
          uv run --frozen pytest tests/unit/db/test_execution.py -q -k 'lease_expiry_never_releases_workspace_or_replays or device_generation_and_sent_operation_are_not_replayed'
      - name: Build, test and verify the installed current-source worker
        run: |
          uv run --no-project python tools/package_sudograph_worker.py --output "$RUNNER_TEMP/sudograph-worker-package"
          uv run --no-project python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'sudograph-worker-package/receipt.json').read_text())
          assert receipt['passed'] is True
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f"SUDOGRAPH_WORKER_PATH={receipt['worker']}\n")
              out.write(f"SUDOGRAPH_WORKER_SHA256={receipt['worker_sha256']}\n")
          PY
      - name: Verify published compiler bytes
        shell: bash
        run: |
          set -euo pipefail
          artifact_temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            artifact_temp="$(cygpath -u "$artifact_temp")"
          fi
          artifacts="$artifact_temp/sudograph-artifacts"
          wheel="$artifacts/sudograph_compiler-0.1.0-py3-none-any.whl"
          mkdir -p "$artifacts"
          if [ ! -f "$wheel" ]; then
            curl --fail --location --output "$wheel" https://github.com/sudoprivacy/sudograph/releases/download/v0.1.0/sudograph_compiler-0.1.0-py3-none-any.whl
          fi
          echo "b0fcd5b257b995f9764081968f4c797f00d5a70f1d04b771c11818f5204e6ef2  $wheel" | sha256sum --check
          uv venv "$RUNNER_TEMP/sudograph-compiler" --python 3.12
          compiler="$RUNNER_TEMP/sudograph-compiler/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then
            compiler="$RUNNER_TEMP/sudograph-compiler/Scripts/python.exe"
          fi
          uv pip install --python "$compiler" --only-binary :all: "$wheel"
          echo "SUDOGRAPH_COMPILER_PYTHON=$compiler" >> "$GITHUB_ENV"
      - name: Run actual connector and compiler acceptance
        run: |
          uv run --no-default-groups --frozen python tools/accept_sudograph_worker.py \
            --worker "$SUDOGRAPH_WORKER_PATH" \
            --worker-sha256 "$SUDOGRAPH_WORKER_SHA256" \
            --compiler-python "$SUDOGRAPH_COMPILER_PYTHON" \
            --emit-review-fixture \
            --output "$RUNNER_TEMP/sudograph-acceptance"
      - name: Check connector regressions and portable source exports
        run: |
          uv run --frozen pytest tests/unit/connectors/test_custom_mcp.py tests/unit/deployment/test_export_public_source.py tests/unit/deployment/test_precommit.py -q
          uv run --frozen pytest tests/integration/test_connectors_api.py -q -k 'patch_custom_mcp_server_default_open_only or shared_custom_mcp_is_visible_with_collision_safe_name or chat_rejects_unknown_mcp or chat_accepts_user_instance_mcp'
          uv run --frozen python tools/export_public_source.py --output "$RUNNER_TEMP/sudograph-public-source"
          uv run --frozen python tools/check_public_source.py --root "$RUNNER_TEMP/sudograph-public-source"
      - name: Check domain client with the real installed worker
        run: |
          export MOSSWORK_TEST_SUDOGRAPH_WORKER="$SUDOGRAPH_WORKER_PATH"
          export MOSSWORK_TEST_SUDOGRAPH_WORKER_SHA256="$SUDOGRAPH_WORKER_SHA256"
          export MOSSWORK_TEST_SUDOGRAPH_COMPILER="$SUDOGRAPH_COMPILER_PYTHON"
          uv run --frozen ruff check src/octop/infra/sudograph tests/unit/sudograph tests/integration/test_sudograph_client_worker.py
          uv run --frozen ruff format --check src/octop/infra/sudograph tests/unit/sudograph tests/integration/test_sudograph_client_worker.py
          uv run --frozen mypy src/octop/infra/sudograph --follow-imports=silent
          uv run --frozen pytest tests/unit/sudograph tests/integration/test_sudograph_client_worker.py -q \
            --basetemp "$RUNNER_TEMP/sudograph-domain-client" --junitxml "$RUNNER_TEMP/sudograph-domain-client.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sudograph-interop-receipts-${{ runner.os }}
          path: |
            ${{ runner.temp }}/sudograph-acceptance/receipt.json
            ${{ runner.temp }}/sudograph-acceptance/checks.json
            ${{ runner.temp }}/sudograph-acceptance/incomplete.json
            ${{ runner.temp }}/sudograph-acceptance/registration.stdout.log
            ${{ runner.temp }}/sudograph-acceptance/registration.stderr.log
            ${{ runner.temp }}/sudograph-acceptance/browser-fixture/
            ${{ runner.temp }}/sudograph-worker-package/*.json
            ${{ runner.temp }}/sudograph-worker-package/*.log
            ${{ runner.temp }}/sudograph-worker-package/*.tgz
            ${{ runner.temp }}/sudograph-domain-client.xml
            ${{ runner.temp }}/fixed-json.xml
            ${{ runner.temp }}/shared-fixtures.xml
            ${{ runner.temp }}/sudograph-domain-client/**/domain-client-receipt.json
            ${{ runner.temp }}/sudograph-domain-client/**/fixed-json-client-receipt.json
          if-no-files-found: ignore
  release-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Test packaging, exports and deployment
        run: uv run --frozen pytest tests/unit/deployment desktop/tests/test_package_company.py desktop/tests/test_company_tools.py tests/unit/infra/test_local_harness.py tests/unit/infra/test_local_components.py tests/unit/infra/test_brand_environment.py -q
      - name: Check shell and workflow syntax
        run: |
          for script in scripts/install-moss-server.sh docker/deploy/*.sh docker/enterprise/{prepare.sh,deploy.sh,start.sh,stop.sh}; do
            bash -n "$script"
          done
          bash -n tools/publish-release-to-cos.sh
          shellcheck scripts/install-moss-server.sh tools/publish-release-to-cos.sh docker/deploy/*.sh docker/enterprise/{prepare.sh,deploy.sh,start.sh,stop.sh}
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/mosswork-ci.yml .github/workflows/mosswork-release.yml .github/workflows/mosswork-cos-publish.yml
      - name: Validate public source export
        run: |
          python3 tools/export_public_source.py --output "$RUNNER_TEMP/mosswork-source"
          python3 tools/check_public_source.py --root "$RUNNER_TEMP/mosswork-source"
