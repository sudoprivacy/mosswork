name: Native desktop updates

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/src/**'
      - 'desktop/package-company.py'
      - 'desktop/tests/**'
      - 'tools/desktop_update_manifest.py'
      - 'tools/publish-release-to-cos.sh'
      - 'tests/unit/deployment/test_desktop_update_manifest.py'
      - 'tests/unit/deployment/test_release_cos.py'
      - '.github/workflows/mosswork-desktop-update.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published desktop release to install and launch on native runners
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: native-updates-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  native-update:
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    name: Native update and restart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/src/go.mod
          cache-dependency-path: desktop/src/go.sum
      - name: Exercise actual HTTP discovery, refusal controls, native swap and relaunch
        working-directory: desktop/src
        run: go test ./internal/desktopupdate -count=1 -v
      - uses: actions/setup-node@v4
        if: runner.os != 'Linux'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install pinned native UI test dependencies
        if: runner.os != 'Linux'
        working-directory: dashboard
        run: npm ci --no-audit --replace-registry-host=never
      - name: Build native login assets and test the actual update UI
        if: runner.os != 'Linux'
        run: |
          node desktop/login/build.mjs
          python desktop/build-dashboard.py
          node --test desktop/tests/desktop-update.test.mjs
      - name: Check native restart task admission and packaged-runtime selection
        if: runner.os != 'Linux'
        working-directory: desktop/src
        run: go test -tags company . -count=1 -v

  installed-client:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    name: Published desktop first launch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-amd64
            extension: exe
          - os: macos-15
            platform: macos-arm64
            extension: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Download the exact published installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/mosswork-release" \
            --pattern SHA256SUMS.txt \
            --pattern "mosswork-company-$PLATFORM-$version.$EXTENSION"
      - name: Install and launch the client with a fresh profile
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv run --no-project python -m desktop.tests.accept_installed_client \
            --version "${RELEASE_TAG#v}" --release-dir "$RUNNER_TEMP/mosswork-release" \
            --output "$RUNNER_TEMP/mosswork-installed-client"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-client-${{ matrix.platform }}
          path: ${{ runner.temp }}/mosswork-installed-client/evidence/
          if-no-files-found: error
