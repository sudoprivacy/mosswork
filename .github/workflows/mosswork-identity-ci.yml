permissions:
  contents: read

concurrency:
  group: mosswork-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-reuse:
    name: Already-tested main tree
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify both original successful platform checkouts
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_identity_reuse.py
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/identity-reuse.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-reuse-proof
          path: ${{ runner.temp }}/identity-reuse.json
          if-no-files-found: ignore

  identity:
    name: Canonical identity (${{ matrix.os }})
    needs: identity-reuse
    # Missing, failed or malformed proof retains every original platform command.
    if: >-
      ${{ !cancelled() && (github.event_name != 'push' ||
          needs.identity-reuse.result != 'success' ||
          needs.identity-reuse.outputs.reuse != 'true') }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_CONCURRENT_BUILDS: '1'
      UV_CONCURRENT_DOWNLOADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check canonical identity source
        run: |
          uv run --frozen ruff check src tests packages/moss-gateway/src/moss_gateway/channels/feishu.py
          uv run --frozen ruff format --check src tests packages/moss-gateway/src/moss_gateway/channels/feishu.py
          uv run --frozen mypy src/octop
      - name: Verify current membership, revocation and original IM identity
        run: |
          uv run --frozen pytest \
            tests/unit/agents/test_personal_moss_identity.py \
            tests/unit/agents/test_personal_moss_access.py \
            tests/unit/identity \
            tests/unit/api/test_canonical_human_review.py \
            tests/unit/test_human_review_mount.py \
            tests/unit/native_host/test_human_review_provider.py \
            tests/unit/native_host/test_human_review_audit.py \
            tests/unit/native_host/test_human_review_provider_audit.py \
            tests/unit/native_host/test_human_review_pages.py \
            tests/unit/native_host/test_human_review_page_admission.py \
            tests/unit/native_host/test_human_review_page_auth.py \
            tests/unit/sudograph/test_review_read.py \
            tests/unit/test_human_review_page_mount.py \
            tests/unit/api/test_canonical_request_dependency.py \
            tests/unit/api/test_canonical_websocket_principal.py \
            tests/unit/api/test_jwt_auth_middleware.py \
            tests/unit/gateway/test_personal_moss_im_identity.py \
            tests/unit/gateway/test_canonical_feishu.py \
            tests/unit/gateway/test_feishu_human_binding.py \
            tests/unit/gateway/test_feishu_delivery_business_store.py \
            tests/unit/gateway/test_feishu_current_dispatch_assertion.py \
            tests/unit/db/test_canonical_identity_projection.py \
            tests/unit/i18n \
            tests/unit/company_runtime/test_local_process.py \
            tests/unit/infra/test_harness_config_imports.py \
            tests/unit/company_runtime/test_desktop_capacity.py \
            -m 'not integration and not live' -q --junitxml=identity-results.xml
          uv run --frozen pytest packages/moss-gateway/tests/channels/test_feishu.py \
            -m 'not integration and not live' -q --junitxml=gateway-feishu-results.xml
      - name: Verify knowledge adapter dependency isolation
        run: |
          uv run --frozen pytest tests/unit/api/test_knowledge_bases.py \
            -m 'not integration and not live' -q --junitxml=knowledge-adapter-results.xml
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked dashboard dependencies
        working-directory: dashboard
        if: runner.os == 'Linux'
        run: npm ci
      - name: Verify login, company selection and credential generations
        working-directory: dashboard
        if: runner.os == 'Linux'
        run: |
          npx vitest run --maxWorkers=1 --no-cache \
            src/api/request.authToken.test.ts \
            src/api/request.unauthorized.test.ts \
            src/api/request.setup.test.ts \
            src/api/canonicalIdentity.test.ts \
            src/api/humanReview.test.ts \
            src/pages/Review/index.test.tsx \
            src/pages/Review/frameReadBridge.test.ts \
            src/hooks/useCanonicalIdentity.test.tsx \
            src/components/AuthGuard.test.tsx \
            src/components/AuthGuard.canonical.test.tsx \
            src/components/AuthGuard.humanReview.test.tsx \
            src/pages/Login/CanonicalLogin.test.tsx \
            src/pages/Login/Login.remember.test.tsx \
            src/pages/Login/Login.forgotPassword.test.tsx \
            --reporter=default --reporter=junit --outputFile=canonical-frontend-results.xml
      - name: Build the complete dashboard
        working-directory: dashboard
        if: runner.os == 'Linux'
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: canonical-frontend
          path: dashboard/canonical-frontend-results.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-identity-${{ runner.os }}
          path: |
            identity-results.xml
            gateway-feishu-results.xml
            knowledge-adapter-results.xml
          if-no-files-found: ignore
